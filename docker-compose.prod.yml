services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: webtummy
      POSTGRES_USER: webtummy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the deployment .env file}
    volumes:
      - ./packages/db/prisma/postgresql-init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtummy -d webtummy"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://webtummy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the deployment .env file}@postgres:5432/webtummy
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    command: sh -c "npm run db:push && npm run db:postgres-init && npm run -w @webtummy/api seed && npm run -w @webtummy/api start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://webtummy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the deployment .env file}@postgres:5432/webtummy
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
