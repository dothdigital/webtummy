name: webtummy-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: webtummy_dev
      POSTGRES_USER: webtummy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./packages/db/prisma/postgresql-init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtummy -d webtummy_dev"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgresql://webtummy:${POSTGRES_PASSWORD}@postgres:5432/webtummy_dev
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_APP_URL: https://doth-dev.webtummy.com
    command: sh -c "npm run db:push && npm run db:postgres-init && npm run -w @webtummy/api seed && npm run db:backfill-workspaces && npm run -w @webtummy/api start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgresql://webtummy:${POSTGRES_PASSWORD}@postgres:5432/webtummy_dev
      REDIS_URL: redis://redis:6379
      WEB_APP_URL: https://doth-dev.webtummy.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_dev_data:
  redis_dev_data:
